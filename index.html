<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc-notes Markdown</title>
    <link rel="icon" href="Bloc-notes_Markdown_icon.ico" type="image/x-icon">
    <meta name="theme-color" content="#8b3a3a">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/preview.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <h1>📝 Bloc-notes Markdown</h1>
        <div id="statusBar" class="status-bar" role="status" aria-live="polite" hidden></div>
        <div class="header-controls editor-header" id="editorHeader" hidden>
            <button id="btnBackHome" class="btn btn-secondary" type="button" title="Enregistrer et revenir à l’accueil">← Retour</button>
            <button id="btnTogglePreview" class="btn btn-secondary preview-toggle" type="button" aria-pressed="false" title="Afficher l’aperçu seul"><span aria-hidden="true">👁</span><span class="preview-toggle-label">Aperçu seul</span></button>
            <input type="text" id="fileName" placeholder="Nom de votre note" title="Fichier Markdown ouvert" aria-label="Nom de la note" maxlength="120">
            <details class="actions-menu" id="editorActionsMenu">
                <summary class="btn btn-secondary">Actions <span aria-hidden="true">▾</span></summary>
                <div class="actions-menu-panel">
                    <button id="btnOpenFile" class="btn btn-secondary" type="button" title="Importer un fichier Markdown">Importer .md</button>
                    <button id="btnDownloadMd" class="btn btn-secondary" type="button" title="Télécharger une copie Markdown">Télécharger .md</button>
                    <button id="btnDownloadHtml" class="btn btn-secondary" type="button" title="Télécharger en HTML">Télécharger .html</button>
                    <button id="btnPrint" class="btn btn-secondary" type="button" title="Imprimer ou exporter en PDF">Imprimer / PDF</button>
                </div>
            </details>
        </div>
    </header>

    <main>
        <section id="homeView" class="home-view" aria-labelledby="homeHeading">
            <div class="home-heading">
                <div>
                    <h2 id="homeHeading">Mes notes</h2>
                    <p id="directoryStatus">Choisissez le dossier qui contient vos fichiers Markdown.</p>
                </div>
                <div class="home-actions">
                    <button id="btnChooseDirectory" class="btn btn-secondary" type="button">Choisir le dossier notes</button>
                    <button id="btnChangeDirectory" class="btn btn-secondary" type="button" hidden>Choisir un autre dossier</button>
                    <button id="btnCreateNote" class="btn btn-primary" type="button" disabled>Nouvelle note</button>
                </div>
            </div>
            <div id="notesEmpty" class="empty-state" hidden>Aucune note Markdown dans ce dossier.</div>
            <ul id="notesList" class="notes-list" aria-label="Fichiers Markdown"></ul>
        </section>

        <section id="editorView" class="editor-view" aria-label="Éditeur de note" hidden>
            <div class="container">
                <section class="panel editor-panel" aria-labelledby="editorHeading">
                    <h2 id="editorHeading">Éditeur</h2>
                    <textarea id="editor" placeholder="Saisissez votre Markdown ici... Les modifications sont enregistrées automatiquement." aria-label="Contenu Markdown"></textarea>
                </section>

                <section class="panel preview-panel" aria-labelledby="previewHeading">
                    <div class="preview-panel-heading">
                        <h2 id="previewHeading">Aperçu</h2>
                        <div id="wordCount" class="word-count" aria-live="polite"></div>
                    </div>
                    <div id="preview" class="preview-content"></div>
                </section>
            </div>

        </section>
    </main>

    <input type="file" id="hiddenFileInput" accept=".md,.markdown,.txt" class="hidden-input" aria-label="Choisir un fichier Markdown">

    <script src="js/core/markdown/parser.js"></script>
    <script src="js/core/markdown/renderer.js"></script>
    <script src="js/services/storage.js"></script>
    <script src="js/services/notes-files.js"></script>
    <script src="js/ui/home-view.js"></script>
    <script src="js/ui/editor-view.js"></script>
    <script src="js/ui/editor-input.js"></script>
    <script src="js/ui/preview-dnd.js"></script>
    <script src="js/ui/html-export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
